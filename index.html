<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>餛飩分裂者</title>

<style>

*{
    box-sizing:border-box;
}


body{

margin:0;

background:#080808;

color:#ddd;

font-family:
"Microsoft JhengHei",
sans-serif;

}



header{

text-align:center;

padding:45px 10px 30px;

}


.title{

font-size:50px;

font-weight:bold;

letter-spacing:6px;

white-space:nowrap;

}


.slogan{

margin-top:12px;

font-size:15px;

color:#999;

white-space:nowrap;

}



nav{

display:flex;

justify-content:center;

gap:12px;

padding:15px;

border-top:1px solid #444;

border-bottom:1px solid #444;

}


nav button{

background:#151515;

border:1px solid #777;

color:white;

padding:10px 18px;

font-size:16px;

white-space:nowrap;

cursor:pointer;

}


nav button:hover{

background:#333;

}





/* 彈窗 */

.window{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

width:85%;

max-width:500px;

background:#111;

border:1px solid #777;

padding:25px;

z-index:10;

}



.window h2{

margin-top:0;

border-left:4px solid white;

padding-left:10px;

}



.window button{

display:block;

width:100%;

margin:10px 0;

background:#222;

color:white;

border:1px solid #666;

padding:12px;

font-size:16px;

cursor:pointer;

}



.close{

background:#500!important;

}




.mask{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.7);

z-index:5;

}



</style>


</head>



<body>


<header>

<div class="title">
餛飩分裂者
</div>


<div class="slogan">
Wonton is not a type of dumpling
</div>


</header>



<nav>

<button onclick="openBox('archive')">
檔案庫
</button>


<button onclick="openBox('story')">
系列故事
</button>


<button onclick="openBox('community')">
社區活動
</button>

</nav>





<div class="mask" id="mask" onclick="closeBox()"></div>



<div class="window" id="archive">

<h2>檔案庫</h2>

<button>組織介紹</button>
<button>成員資料</button>
<button>行動記錄</button>
<button>重要事件</button>

<button class="close" onclick="closeBox()">
關閉
</button>

</div>





<div class="window" id="story">

<h2>系列故事</h2>

<button>阿齊事件</button>
<button>春节晚會突襲</button>
<button>Legendary計畫</button>

<button class="close" onclick="closeBox()">
關閉
</button>

</div>





<div class="window" id="community">

<h2>社區活動</h2>

<button>討論區</button>
<button>活動公告</button>
<button>加入組織</button>

<button class="close" onclick="closeBox()">
關閉
</button>

</div>





<script>


function openBox(id){

document.getElementById("mask").style.display="block";

document.getElementById(id).style.display="block";

}



function closeBox(){

document.getElementById("mask").style.display="none";


document.querySelectorAll(".window").forEach(e=>{

e.style.display="none";

});

}


</script>



</body>

</html>
