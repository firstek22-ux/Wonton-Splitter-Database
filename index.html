<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>餛飩分裂者</title>


<style>

body{

margin:0;

background:#080808;

color:#ddd;

font-family:"Microsoft JhengHei",sans-serif;

}



header{

text-align:center;

padding:50px 20px 30px;

}



.title{

font-size:55px;

font-weight:bold;

letter-spacing:8px;

}



.slogan{

font-size:16px;

color:#999;

margin-top:15px;

font-style:italic;

}



nav{

display:flex;

justify-content:center;

gap:20px;

border-top:1px solid #444;

border-bottom:1px solid #444;

padding:15px;

}



button{

background:#111;

color:#ddd;

border:1px solid #666;

padding:12px 35px;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#333;

}



.content{

max-width:900px;

margin:40px auto;

padding:20px;

}



.page{

display:none;

background:#111;

border:1px solid #444;

padding:30px;

}



.active{

display:block;

}



h2{

border-left:5px solid white;

padding-left:15px;

}



</style>


</head>



<body>


<header>

<div class="title">

餛飩分裂者

</div>


<div class="slogan">

Wonton is not a type of dumpling

</div>


</header>



<nav>

<button onclick="show('archive')">

檔案庫

</button>


<button onclick="show('story')">

系列故事

</button>


<button onclick="show('community')">

社區活動

</button>


</nav>




<div class="content">


<div id="archive" class="page active">


<h2>
檔案庫
</h2>


<p>
此處保存餛飩分裂者相關資料。
</p>


<p>
包括組織歷史、行動記錄、成員資料以及重要事件。
</p>


</div>




<div id="story" class="page">


<h2>
系列故事
</h2>


<p>
記錄餛飩文明的歷史，以及我們與基金會、其他組織的衝突。
</p>


<p>
「馄饨不是饺子。」
</p>


</div>




<div id="community" class="page">


<h2>
社區活動
</h2>


<p>
加入討論，參與餛飩文化研究與相關活動。
</p>


</div>



</div>




<script>


function show(id){

let pages=document.querySelectorAll(".page");


pages.forEach(p=>{

p.classList.remove("active");

});


document.getElementById(id).classList.add("active");


}


</script>



</body>

</html>
